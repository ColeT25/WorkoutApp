<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">WorkoutApp history screen mockup</title>
  <desc id="desc">A mobile history screen showing a calendar week, completed workout count, and dated workout sessions.</desc>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #202124; }
    .muted { fill: #6f737b; }
    .small { font-size: 13px; }
    .body { font-size: 15px; }
    .label { font-size: 14px; font-weight: 600; }
    .title { font-size: 29px; font-weight: 750; letter-spacing: -0.7px; }
    .card-title { font-size: 18px; font-weight: 700; }
  </style>
  <rect width="390" height="844" fill="#eef0f2"/>
  <rect x="9" y="9" width="372" height="826" rx="28" fill="#fbfbfc"/>
  <rect x="151" y="18" width="88" height="5" rx="3" fill="#c9cbd0"/>
  <text x="31" y="61" class="small muted">9:41</text>
  <text x="31" y="102" class="small muted">SESSIONS</text>
  <text x="31" y="139" class="title">History</text>
  <text x="359" y="137" class="body" text-anchor="end" fill="#c43d3d">September 2026 ˅</text>

  <rect x="25" y="172" width="340" height="123" rx="22" fill="#171821"/>
  <text x="47" y="207" class="small" fill="#efc0c0">THIS MONTH</text>
  <text x="47" y="253" class="title" fill="#ffffff">8 workouts</text>
  <text x="47" y="276" class="small" fill="#d7d7df">2 more than last month</text>
  <circle cx="318" cy="233" r="35" fill="none" stroke="#474752" stroke-width="8"/>
  <path d="M318 198a35 35 0 1 1-29 55" fill="none" stroke="#e37f7f" stroke-width="8" stroke-linecap="round"/>
  <text x="318" y="238" class="label" text-anchor="middle" fill="#ffffff">8 / 12</text>

  <text x="31" y="347" class="label">September 14–20</text>
  <rect x="25" y="365" width="340" height="95" rx="18" fill="#f5f6f7" stroke="#dedfe3"/>
  <g class="small muted" text-anchor="middle">
    <text x="53" y="393">M</text><text x="101" y="393">T</text><text x="149" y="393">W</text><text x="197" y="393">T</text><text x="245" y="393">F</text><text x="293" y="393">S</text><text x="341" y="393">S</text>
  </g>
  <g class="small" text-anchor="middle">
    <text x="53" y="423">14</text><text x="101" y="423">15</text><text x="149" y="423">16</text><text x="197" y="423">17</text><text x="245" y="423">18</text><text x="293" y="423">19</text><text x="341" y="423">20</text>
  </g>
  <circle cx="53" cy="440" r="3.5" fill="#c43d3d"/><circle cx="101" cy="440" r="3.5" fill="#c43d3d"/>

  <text x="31" y="512" class="label">Recent workouts</text>
  <rect x="25" y="531" width="340" height="76" rx="17" fill="#fbfbfc" stroke="#dedfe3"/>
  <circle cx="54" cy="569" r="16" fill="#dff5e8"/><path d="M47 569l4 4 8-9" fill="none" stroke="#218653" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="82" y="564" class="card-title">Lower Body</text><text x="82" y="586" class="small muted">Sun, Sep 14  ·  5 exercises</text><text x="341" y="576" class="body muted" text-anchor="middle">›</text>
  <rect x="25" y="621" width="340" height="76" rx="17" fill="#fbfbfc" stroke="#dedfe3"/>
  <circle cx="54" cy="659" r="16" fill="#dff5e8"/><path d="M47 659l4 4 8-9" fill="none" stroke="#218653" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="82" y="654" class="card-title">Upper Body</text><text x="82" y="676" class="small muted">Thu, Sep 11  ·  5 exercises</text><text x="341" y="666" class="body muted" text-anchor="middle">›</text>
  <rect x="25" y="711" width="340" height="76" rx="17" fill="#fbfbfc" stroke="#dedfe3"/>
  <circle cx="54" cy="749" r="16" fill="#fff1d8"/><text x="54" y="754" class="label" text-anchor="middle" fill="#a86d14">!</text>
  <text x="82" y="744" class="card-title">Upper Body</text><text x="82" y="766" class="small muted">Tue, Sep 9  ·  Too hard</text><text x="341" y="756" class="body muted" text-anchor="middle">›</text>
  <line x1="25" y1="806" x2="365" y2="806" stroke="#e3e4e7"/>
  <g text-anchor="middle">
    <circle cx="70" cy="826" r="4" fill="#9da1a9"/><text x="70" y="842" class="small muted">Today</text>
    <circle cx="166" cy="826" r="4" fill="#9da1a9"/><text x="166" y="842" class="small muted">Plans</text>
    <circle cx="262" cy="826" r="4" fill="#c43d3d"/><text x="262" y="842" class="small" fill="#c43d3d">History</text>
  </g>
</svg>
